<div class="login-container">

    <div>
        <div class="welcome-text">
        </div>
    </div>

    <div class="container-fluid login-page d-flex justify-content-end align-items-center py-4">

        <div class="row justify-content-end w-100">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- Login Card -->
                <div class="login-card border rounded-3 shadow-sm p-4 p-md-5">

                    <!-- Heading -->
                    <div class="login-heading mb-4">
                        <h3 class="fw-bold mb-2">Welcome Back!</h3>
                        <p class="text-secondary mb-0">
                            Please sign in to your account.
                        </p>
                    </div>

                    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email" class="form-label fw-semibold">
                                Email
                            </label>

                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="Enter your email" [(ngModel)]="email" required #emailField="ngModel" />

                            @if (emailField.invalid && emailField.touched) {
                            <small class="text-danger">
                                Enter a valid email address.
                            </small>
                            }

                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password" class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="password-wrapper">

                                <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                                    class="form-control" placeholder="Enter your password" [(ngModel)]="password"
                                    required #passwordField="ngModel" />

                                <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"
                                    (click)="togglePassword()">
                                </i>

                            </div>

                            @if (passwordField.invalid && passwordField.touched) {
                            <small class="text-danger">
                                Password is required.
                            </small>
                            }

                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe"
                                    [(ngModel)]="rememberMe" />

                                <label class="form-check-label" for="rememberMe">
                                    Remember me
                                </label>

                            </div>

                            <a routerLink="/forgot-password" class="forgot-link">
                                Forgot Password?
                            </a>

                        </div>

                        <!-- Sign In Button -->
                        <button type="submit" class="btn btn-bcms w-100">

                            Sign In
                            <i class="bi bi-arrow-right ms-2"></i>

                        </button>

                    </form>

                    <!-- Footer -->
                    <div class="login-footer text-center mt-4">
                        <p class="text-secondary mb-0">
                            © 2026 Baroda Cash Management Services
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
